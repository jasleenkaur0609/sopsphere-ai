<svg width="340" height="70" viewBox="0 0 340 70" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#22C55E"></stop>
<stop offset="100%" stop-color="#9333EA"></stop>
</linearGradient>

<linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#FFFFFF"></stop>
<stop offset="100%" stop-color="#D4D4D8"></stop>
</linearGradient>

</defs>

<!-- Outer Ring -->

<circle cx="35" cy="35" r="28" stroke="url(#logoGradient)" stroke-width="3" fill="none"></circle>

<!-- Inner Circle -->

<circle cx="35" cy="35" r="17" fill="url(#logoGradient)"></circle>

<!-- AI Node -->

<circle cx="35" cy="35" r="4" fill="white"></circle>

<!-- Connection Lines -->

<line x1="35" y1="18" x2="35" y2="31" stroke="white" stroke-width="2"></line>

<line x1="35" y1="39" x2="35" y2="52" stroke="white" stroke-width="2"></line>

<line x1="18" y1="35" x2="31" y2="35" stroke="white" stroke-width="2"></line>

<line x1="39" y1="35" x2="52" y2="35" stroke="white" stroke-width="2"></line>

<!-- Nodes -->

<circle cx="35" cy="18" r="3" fill="#22C55E"></circle>
<circle cx="35" cy="52" r="3" fill="#9333EA"></circle>
<circle cx="18" cy="35" r="3" fill="#22C55E"></circle>
<circle cx="52" cy="35" r="3" fill="#9333EA"></circle>

<!-- Brand -->

<text x="80" y="31" font-size="22" font-family="Segoe UI" font-weight="700" fill="url(#textGradient)">
AI SOP
</text>

<text x="80" y="54" font-size="15" font-family="Segoe UI" font-weight="500" fill="#A1A1AA">
Management Portal
</text>

</svg>